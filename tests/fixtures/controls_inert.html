<!doctype html>
<html><head><meta charset="utf-8"><title>Weekly recipe letter</title></head>
<body>
<section id="letter">
  <h2>The weekly recipe letter</h2>
  <p>Sign up for the weekly recipe letter, delivered every Sunday morning with three new dinners.</p>
  <input id="email" type="email" placeholder="Your email address">
  <button id="go" type="button" onclick="document.getElementById('out').textContent='subscribed'">Subscribe to the letter</button>
  <button id="icon" type="button" class="icon"><svg viewBox="0 0 10 10" width="16" height="16"><circle cx="5" cy="5" r="4"/></svg></button>
  <p id="out">not subscribed</p>
</section>
</body></html>
